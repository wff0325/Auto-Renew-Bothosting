name: Auto Renew Gaming4Free

on:
  workflow_dispatch:
  schedule:
    # 每 30 分钟跑一次：服务器每票只加 30 分钟，48 小时不投票就会挂起，
    # 30 分钟一次可以把剩余时长稳在 48 小时上限附近。
    - cron: '13,43 * * * *'

concurrency:
  group: renew-gaming4free-group
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  renew-gaming4free:
    runs-on: ubuntu-24.04
    # Turnstile 出 token 实测要 18s~200s, 加上失败重试, 20 分钟不够用
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: ⚙️ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 🛠️ 安装系统依赖和python依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install patchright requests 'requests[socks]'
          python -m patchright install --with-deps chrome

      # Turnstile 对"全新浏览器 profile"会格外严格（实测出 token 要 18s~200s），
      # 复用同一个 profile 目录能让 clearance cookie 留下来，明显更快更稳。
      - name: 💾 恢复浏览器 profile 缓存
        uses: actions/cache@v4
        with:
          path: .g4f_profile
          key: g4f-profile-${{ runner.os }}-${{ hashFiles('.g4f_profile/.keep') }}
          restore-keys: |
            g4f-profile-${{ runner.os }}-

      # 注意: 这里**故意不挂代理**。
      # 实测挂 sing-box 代理时, GitHub runner 上 GET /api/servers 正常但
      # POST /api/servers/{slug}/vote 直接 "TypeError: Failed to fetch"
      # (站点自己的 JS 也报 Network error), 整个投票流程走不通。
      # Turnstile token 与挑战页出口 IP 绑定, 代理链路一旦对 POST 不友好
      # 就会拿不到可用 token。直连虽然 runner IP 信誉一般, 但链路一致、稳定。
      #
      # 如果将来确实需要代理, 用 IS_PROXY 环境变量打开即可:
      #   IS_PROXY: true
      #   PROXY_SERVER: socks5://127.0.0.1:1080

      - name: 🚀 运行续期脚本
        env:
          G4F_SLUG: ${{ secrets.G4F_SLUG }}
          G4F_THRESHOLD: ${{ secrets.G4F_THRESHOLD }}
          G4F_MAX_VOTES: ${{ secrets.G4F_MAX_VOTES }}
          G4F_VOTER_NAME: ${{ secrets.G4F_VOTER_NAME }}
          G4F_TS_TIMEOUT: ${{ vars.G4F_TS_TIMEOUT || '240' }}
          IS_PROXY: ${{ vars.G4F_USE_PROXY || 'false' }}
          PROXY_SERVER: socks5://127.0.0.1:1080
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # Turnstile 必须真实浏览器，脚本会自己起一个 Chrome 进程并用 CDP 接管，
          # 所以需要 xvfb 提供显示环境。
          #
          # 失败会以非 0 退出码结束 —— 工作流会变红，不要用 `|| true` 掩盖，
          # 否则会出现"绿勾但其实没投上票"。
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -u gaming4free_renew.py

      # 更新时间到time.txt,避免6个月未更新导致工作流暂停
      - name: 🕒 更新时间
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            for i in {1..2..3}; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
          fi

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
