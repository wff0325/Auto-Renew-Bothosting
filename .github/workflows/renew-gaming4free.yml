name: Auto Renew Gaming4Free

on:
  workflow_dispatch:
  schedule:
    # 每 30 分钟跑一次：服务器每票只加 30 分钟，48 小时不投票就会挂起，
    # 30 分钟一次可以把剩余时长稳在 48 小时上限附近。
    - cron: '13,43 * * * *'

concurrency:
  group: renew-gaming4free-group
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  renew-gaming4free:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: ⚙️ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 🛠️ 安装系统依赖和python依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install patchright requests 'requests[socks]'
          python -m patchright install --with-deps chrome

      - name: ⚙️ 设置sing-box代理
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        env:
          G4F_SLUG: ${{ secrets.G4F_SLUG }}
          G4F_THRESHOLD: ${{ secrets.G4F_THRESHOLD }}
          G4F_MAX_VOTES: ${{ secrets.G4F_MAX_VOTES }}
          G4F_VOTER_NAME: ${{ secrets.G4F_VOTER_NAME }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # Turnstile 必须真实浏览器，脚本会自己起一个 Chrome 进程并用 CDP 接管，
          # 所以需要 xvfb 提供显示环境。
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python -u gaming4free_renew.py

      # 更新时间到time.txt,避免6个月未更新导致工作流暂停
      - name: 🕒 更新时间
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" > time.txt
          git add time.txt
          if git diff --cached --quiet; then
            echo "No need to commit"
          else
            git commit -m "⏱️ Auto Update by Github Actions $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"
            for i in {1..2..3}; do
              git pull --rebase origin main && git push origin main && break || sleep 2
            done
          fi

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done
